services:
  backend:
    build: .
    container_name: go-backend
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "8080"
    environment:
      - GIN_MODE=release
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
    depends_on:
      - backend
    tmpfs:
      - /var/cache/nginx
      - /var/run

networks:
  internal:
    driver: bridge
